name: Bootstrap canonical Framework

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target App
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run one-time bootstrap
        run: bash .github/bootstrap-framework.sh
